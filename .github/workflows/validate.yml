name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Check that every version representation agrees
        run: python scripts/version.py check

      - name: Run the test suite
        run: python -m pytest -q

      - name: Byte-compile both products
        run: python -m compileall -q custom_components daemon scripts tests

      - name: Lint
        run: python -m ruff check custom_components daemon scripts tests
